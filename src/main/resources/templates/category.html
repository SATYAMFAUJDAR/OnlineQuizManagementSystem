<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Select Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                    linear-gradient(
                            135deg,
                            #eef2ff,
                            #f8fafc
                    );

            min-height: 100vh;

            padding: 30px 20px;
        }


        .container {

            max-width: 850px;

            margin: auto;
        }


        /* HEADER */

        .header {

            text-align: center;

            margin-bottom: 30px;
        }


        .header-icon {

            font-size: 55px;

            margin-bottom: 10px;
        }


        h1 {

            margin: 5px 0;

            color: #1f2937;
        }


        .subtitle {

            color: #6b7280;

            margin: 0;
        }


        /* CARD */

        .card {

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                    0 10px 30px
                    rgba(0,0,0,0.09);

            margin-bottom: 20px;
        }


        .title {

            font-size: 18px;

            font-weight: bold;

            color: #374151;

            margin-bottom: 15px;
        }


        /* CATEGORY */

        .categories {

            display: grid;

            grid-template-columns:
                    repeat(2, 1fr);

            gap: 15px;
        }


        .category {

            border: 2px solid #e5e7eb;

            background: #f9fafb;

            padding: 20px;

            border-radius: 15px;

            cursor: pointer;

            text-align: center;

            transition: 0.2s;
        }


        .category:hover {

            border-color: #818cf8;

            transform: translateY(-2px);

            background: #f5f5ff;
        }


        .category.selected {

            border-color: #4f46e5;

            background: #eef2ff;

            box-shadow:
                    0 0 0 3px
                    rgba(79,70,229,0.12);
        }


        .category-icon {

            font-size: 42px;

            margin-bottom: 8px;
        }


        .category-name {

            font-weight: bold;

            font-size: 17px;

            color: #1f2937;
        }


        /* DIFFICULTY */

        .difficulty {

            display: grid;

            grid-template-columns:
                    repeat(3, 1fr);

            gap: 15px;
        }


        .difficulty label {

            cursor: pointer;
        }


        .difficulty input {

            display: none;
        }


        .difficulty-box {

            text-align: center;

            padding: 15px;

            border-radius: 12px;

            border: 2px solid #e5e7eb;

            background: #f9fafb;

            font-weight: bold;

            transition: 0.2s;
        }


        .difficulty input:checked +
        .difficulty-box {

            border-color: #4f46e5;

            background: #eef2ff;

            color: #4f46e5;
        }


        .easy {

            color: #15803d;
        }


        .medium {

            color: #b45309;
        }


        .hard {

            color: #dc2626;
        }


        /* START BUTTON */

        .start-btn {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #4f46e5;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .start-btn:hover {

            background: #4338ca;
        }


        /* BACK */

        .back {

            display: block;

            text-align: center;

            color: #4f46e5;

            text-decoration: none;

            font-weight: bold;

            margin-top: 20px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {

                padding: 20px 15px;
            }


            .card {

                padding: 20px;
            }


            .categories {

                grid-template-columns: 1fr;
            }


            .difficulty {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="header-icon">

            🎯

        </div>


        <h1>

            Choose Your Quiz

        </h1>


        <p class="subtitle">

            Select a subject and difficulty level

        </p>

    </div>



    <!-- FORM -->

    <form
            action="/quiz"
            method="get"
            onsubmit="return validateQuiz()">


        <!-- CATEGORY -->

        <div class="card">


            <div class="title">

                📚 Select Category

            </div>


            <div class="categories">


                <!-- JAVA -->

                <div
                        class="category"
                        onclick="selectCategory(this, 'Java')">

                    <div class="category-icon">

                        ☕

                    </div>

                    <div class="category-name">

                        Java

                    </div>

                </div>



                <!-- DSA -->

                <div
                        class="category"
                        onclick="selectCategory(this, 'DSA')">

                    <div class="category-icon">

                        🌳

                    </div>

                    <div class="category-name">

                        Data Structures & Algorithms

                    </div>

                </div>



                <!-- C -->

                <div
                        class="category"
                        onclick="selectCategory(this, 'C Programming')">

                    <div class="category-icon">

                        💻

                    </div>

                    <div class="category-name">

                        C Programming

                    </div>

                </div>



                <!-- SOFTWARE ENGINEERING -->

                <div
                        class="category"
                        onclick="selectCategory(this, 'Software Engineering')">

                    <div class="category-icon">

                        ⚙️

                    </div>

                    <div class="category-name">

                        Software Engineering

                    </div>

                </div>


            </div>


            <!-- HIDDEN CATEGORY -->

            <input
                    type="hidden"
                    name="category"
                    id="categoryInput">


        </div>



        <!-- DIFFICULTY -->

        <div class="card">


            <div class="title">

                🎚️ Select Difficulty

            </div>


            <div class="difficulty">


                <!-- EASY -->

                <label>

                    <input
                            type="radio"
                            name="difficulty"
                            value="Easy">

                    <div class="difficulty-box easy">

                        🟢 Easy

                    </div>

                </label>



                <!-- MEDIUM -->

                <label>

                    <input
                            type="radio"
                            name="difficulty"
                            value="Medium">

                    <div class="difficulty-box medium">

                        🟡 Medium

                    </div>

                </label>



                <!-- HARD -->

                <label>

                    <input
                            type="radio"
                            name="difficulty"
                            value="Hard">

                    <div class="difficulty-box hard">

                        🔴 Hard

                    </div>

                </label>


            </div>


        </div>



        <!-- START -->

        <button
                type="submit"
                class="start-btn">

            🚀 Start Quiz

        </button>


    </form>



    <!-- BACK -->

    <a
            href="/student"
            class="back">

        ← Back to Student Entry

    </a>


</div>



<script>


    function selectCategory(
        element,
        category) {


        // Remove previous selection

        document
            .querySelectorAll(".category")
            .forEach(function(item) {

                item.classList.remove(
                    "selected"
                );

            });


        // Select category

        element.classList.add(
            "selected"
        );


        // Save category

        document.getElementById(
            "categoryInput"
        ).value = category;

    }



    function validateQuiz() {


        const category =
            document.getElementById(
                "categoryInput"
            ).value;


        const difficulty =
            document.querySelector(
                'input[name="difficulty"]:checked'
            );


        if (category === "") {

            alert(
                "Please select a category."
            );

            return false;
        }


        if (!difficulty) {

            alert(
                "Please select a difficulty level."
            );

            return false;
        }


        return true;

    }

</script>


</body>

</html>
