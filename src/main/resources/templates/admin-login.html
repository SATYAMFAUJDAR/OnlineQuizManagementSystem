<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Online Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                    linear-gradient(
                            135deg,
                            #eef2ff,
                            #f8fafc
                    );
        }

        .login-card {
            width: 400px;
            max-width: 92%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                    0 15px 40px
                    rgba(0, 0, 0, 0.10);
        }

        .icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eef2ff;

            font-size: 38px;
        }

        h1 {
            text-align: center;

            margin: 5px 0;

            color: #1f2937;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #374151;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #4f46e5;

            box-shadow:
                    0 0 0 3px
                    rgba(79, 70, 229, 0.10);
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #4338ca;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #4f46e5;

            text-decoration: none;

            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        .security {
            text-align: center;

            margin-top: 22px;

            padding-top: 18px;

            border-top: 1px solid #e5e7eb;

            color: #9ca3af;

            font-size: 13px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

    </style>

</head>


<body>


<div class="login-card">


    <div class="icon">
        🔐
    </div>


    <h1>
        Admin Login
    </h1>


    <p class="subtitle">
        Login to manage the Online Quiz System
    </p>


    <form
            action="/admin/login"
            method="post">


        <div class="input-group">

            <label for="username">
                Username
            </label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required>

        </div>


        <div class="input-group">

            <label for="password">
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required>

        </div>


        <button
                type="submit"
                class="login-btn">

            🔑 Login
            <div class="error"
                 th:if="${error}"
                 th:text="${error}">
            </div>
        </button>


    </form>


    <a
            href="/"
            class="back">

        ← Back to Home

    </a>


    <div class="security">

        🔒 Admin access only

    </div>

</div>


</body>

</html>
