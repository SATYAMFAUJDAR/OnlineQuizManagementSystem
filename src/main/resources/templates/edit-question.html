<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Question - Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* HEADER */

        .header {
            background: white;
            padding: 18px 30px;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            color: #4f46e5;
        }

        .back {
            text-decoration: none;
            color: #4f46e5;
            font-weight: bold;
        }

        /* CONTAINER */

        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            margin: 0 0 6px;
            font-size: 29px;
        }

        .title p {
            margin: 0;
            color: #6b7280;
        }

        /* CARD */

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 18px;

            box-shadow:
                    0 8px 25px
                    rgba(0, 0, 0, 0.06);
        }

        /* ROW */

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 20px;
        }

        .row .field {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 13px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4f46e5;

            box-shadow:
                    0 0 0 3px
                    rgba(79, 70, 229, 0.10);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        /* ID */

        .id-input {
            background: #f3f4f6;
            color: #6b7280;
            cursor: not-allowed;
        }

        /* OPTIONS */

        .options-title {
            font-size: 18px;
            font-weight: bold;

            margin: 25px 0 15px;
            padding-top: 20px;

            border-top: 1px solid #e5e7eb;
        }

        .option {
            display: grid;

            grid-template-columns: 45px 1fr;

            align-items: center;

            margin-bottom: 14px;
        }

        .option-label {
            width: 35px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eef2ff;
            color: #4f46e5;

            font-weight: bold;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .update-btn,
        .cancel-btn {
            flex: 1;

            padding: 13px;

            border-radius: 9px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .update-btn {
            border: none;
            background: #4f46e5;
            color: white;
        }

        .update-btn:hover {
            background: #4338ca;
        }

        .cancel-btn {
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
        }

        .cancel-btn:hover {
            background: #f9fafb;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .header {
                padding: 15px 18px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .form-card {
                padding: 22px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">

        🧠 Online Quiz Admin

    </div>


    <a
            href="/admin"
            class="back">

        ← Dashboard

    </a>

</header>



<!-- MAIN -->

<main class="container">


    <div class="title">

        <h1>

            ✏️ Edit Question

        </h1>

        <p>

            Update the selected question and save your changes.

        </p>

    </div>



    <div class="form-card">


        <form
                action="/admin/question/edit"
                method="post">


            <!-- ID + CATEGORY -->

            <div class="row">


                <div class="field">

                    <label for="id">

                        🆔 Question ID

                    </label>

                    <input
                            type="number"
                            id="id"
                            name="id"
                            class="id-input"
                            th:value="${question.id}"
                            readonly>

                </div>


                <div class="field">

                    <label for="category">

                        📚 Category

                    </label>

                    <select
                            id="category"
                            name="category"
                            required>

                        <option value="Java"
                                th:selected="${question.category == 'Java'}">

                            Java

                        </option>

                        <option value="DSA"
                                th:selected="${question.category == 'DSA'}">

                            Data Structures & Algorithms

                        </option>

                        <option value="C Programming"
                                th:selected="${question.category == 'C Programming'}">

                            C Programming

                        </option>

                        <option value="Software Engineering"
                                th:selected="${question.category == 'Software Engineering'}">

                            Software Engineering

                        </option>

                    </select>

                </div>


            </div>



            <!-- DIFFICULTY -->

            <div class="field">

                <label for="difficulty">

                    🎚️ Difficulty

                </label>

                <select
                        id="difficulty"
                        name="difficulty"
                        required>

                    <option value="Easy"
                            th:selected="${question.difficulty == 'Easy'}">

                        🟢 Easy

                    </option>

                    <option value="Medium"
                            th:selected="${question.difficulty == 'Medium'}">

                        🟡 Medium

                    </option>

                    <option value="Hard"
                            th:selected="${question.difficulty == 'Hard'}">

                        🔴 Hard

                    </option>

                </select>

            </div>



            <!-- QUESTION -->

            <div class="field">

                <label for="question">

                    ❓ Question

                </label>

                <textarea
                        id="question"
                        name="question"
                        th:text="${question.question}"
                        required></textarea>

            </div>



            <!-- OPTIONS -->

            <div class="options-title">

                📝 Answer Options

            </div>



            <!-- A -->

            <div class="option">

                <div class="option-label">

                    A

                </div>

                <input
                        type="text"
                        name="optionA"
                        th:value="${question.optionA}"
                        required>

            </div>



            <!-- B -->

            <div class="option">

                <div class="option-label">

                    B

                </div>

                <input
                        type="text"
                        name="optionB"
                        th:value="${question.optionB}"
                        required>

            </div>



            <!-- C -->

            <div class="option">

                <div class="option-label">

                    C

                </div>

                <input
                        type="text"
                        name="optionC"
                        th:value="${question.optionC}"
                        required>

            </div>



            <!-- D -->

            <div class="option">

                <div class="option-label">

                    D

                </div>

                <input
                        type="text"
                        name="optionD"
                        th:value="${question.optionD}"
                        required>

            </div>



            <!-- CORRECT ANSWER -->

            <div class="field">

                <label for="correctAnswer">

                    ✅ Correct Answer

                </label>

                <select
                        id="correctAnswer"
                        name="correctAnswer"
                        required>

                    <option value="A"
                            th:selected="${question.correctAnswer == 'A'}">

                        A

                    </option>

                    <option value="B"
                            th:selected="${question.correctAnswer == 'B'}">

                        B

                    </option>

                    <option value="C"
                            th:selected="${question.correctAnswer == 'C'}">

                        C

                    </option>

                    <option value="D"
                            th:selected="${question.correctAnswer == 'D'}">

                        D

                    </option>

                </select>

            </div>



            <!-- BUTTONS -->

            <div class="buttons">


                <a
                        href="/admin"
                        class="cancel-btn">

                    Cancel

                </a>


                <button
                        type="submit"
                        class="update-btn">

                    💾 Update Question

                </button>


            </div>


        </form>


    </div>


</main>


</body>

</html>
